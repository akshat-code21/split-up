name: TODO → Issues + PR links

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  convert_todos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create issues for TODOs
        uses: alstr/todo-to-issue-action@v5
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}